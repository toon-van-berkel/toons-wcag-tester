name: SVG Rendering Test

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  svg-test:
    runs-on: ubuntu-latest

    steps:
      - name: Intentionally fail
        run: exit 1

      - name: Display failure SVG
        if: failure()
        run: |
          echo '# WCAG Test Results' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '![WCAG Failed](https://raw.githubusercontent.com/toon-van-berkel/toons-wcag-tester/main/assets/failed.svg)' >> "$GITHUB_STEP_SUMMARY"
